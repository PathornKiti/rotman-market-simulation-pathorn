# EQUITY TRADING (algorithmic market making)
# Defaults match `python -m ritc sim equity`.

[case]
tickers = ["SPNG", "SMMR", "ATMN"]
max_order = { SPNG = 10000, SMMR = 10000, ATMN = 10000 }

[risk]
[risk.max_position]
SPNG = 25000
SMMR = 25000
ATMN = 25000
[risk.groups.equity]
gross = 200000
net = 100000
weights = { SPNG = 1.0, SMMR = 1.0, ATMN = 1.0 }

[strategy]
min_half_spread = 0.02         # never quote tighter than this each side
vol_mult = 1.5                 # half-spread >= vol_mult * per-tick price std
skew_per_share = 0.000003      # reservation price shift per share of inventory
imbalance_lean = 0.25
size = 2000                    # base quote size
max_inventory = 20000          # size taper reaches zero here
hard_inventory = 22000         # past this, cross the spread to cut inventory
vol_halflife = 20             # EWMA vol (used until GARCH has enough data, or if vol_model = "ewma")
vol_model = "ewma"            # or "garch": GARCH(1,1) on mid log-returns, refit every 50 ticks.
                              # GARCH lost to EWMA on 5/5 simulator seeds - but the simulator has no
                              # volatility clustering, which is exactly what GARCH exploits. A/B both
                              # in the official RIT practice case before choosing.
garch_window = 600            # rolling window of returns used for the fit
ou_weight = 0.5               # lean toward the mean-reversion forecast (only when significant)
ou_horizon = 10               # ticks ahead for that forecast
requote_tolerance = 0.01
jump_sigmas = 4.0              # jump guard: a one-tick move > max(jump_sigmas x vol, jump_floor) pulls quotes
jump_floor = 0.05              #   ($ floor so quiet stocks don't trip it on one tick of noise)
jump_pause_ticks = 2           #   for this many ticks. 0 sigmas = off.
[strategy.per_ticker.ATMN]
min_half_spread = 0.03

[run]
max_drawdown = 4000          # kill switch: $ below peak NLV -> flatten + halt. A CATASTROPHE stop, ~1.5-2x the
                             # worst normal drawdown on 8 sim seeds: $2.6k; $2k cost $2.7k of mean NLV.
                             # Set near the normal drawdown it cuts winners at the bottom. Rescale to the real case's P&L.
drawdown_soft_start = 0.5     # from this fraction of max_drawdown, new-risk sizes shrink linearly...
drawdown_floor = 0.25         # ...to this fraction at the kill (exits/hedges always run at full size)
feed_poll = 0.1               # real-time news/tender poll interval, seconds
interval = 0.2
wind_down_ticks = 8
