# PRACTICE PROFILES: `python -m ritc run liquidity --live -v --forever --record --profile rotate` (docs/MANUAL.md).
# Each profile is a set of --set overrides on top of config/liquidity.toml. `--profile rotate` runs the profile with the
# fewest heats in logs/ so far, so the profiles take turns; `python -m ritc practice` compares them.
#
#   A_default  the competition default (adaptive front-load + ML sprint model). Use in crowded / bot-heavy rounds.
#   rsi_bot    accept every price-beating fixed tender, ride the 10-tick trend (colleague's RSI idea). Lost in the bot round.
#   rsi_ml     rsi_bot with the ML price model as the trend signal.

[A_default]                           # THE DEFAULT (= adaptive MF since 2026-10-16): no overrides


[rsi_ml]                              # rsi_bot WITH THE ML MODEL AS THE TREND SIGNAL (2026-10-18, practice): same accepts and
"strategy.accept_touch_edge" = 0.0    # crowded safeguard as rsi_bot, but hold while the ML price model (sprint_model)
"execution.trend_hold_ticks" = 10     # predicts the next 10 ticks our way, instead of the last 10 ticks' move. Out-of-
"execution.trend_hold_signal" = "ml"  # sample replay (54 heats, model trained to 10-15): +$25.4k/heat vs the default
"execution.trend_hold_min_start_crowded" = 0.05   # (momentum +$26.8k, a tie), worst 10% $28.5k (momentum $23.8k);
# start >= 0.05 when crowded: crowded +$11.9k, worst crowded heat -$9.9k. Logs "TREND HOLD X: ... ML next 10 ticks".

