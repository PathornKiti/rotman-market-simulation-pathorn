# PRACTICE PROFILES for `python -m ritc run liability --live -v --forever --record --profile rotate` (docs/RUNBOOK.md,
# section 6). Each profile is a set of --set overrides on top of config/liability.toml. `--profile rotate` runs the
# profile with the fewest heats in logs/ so far (ties: the order below), so two profiles ALTERNATE heat by heat, and
# the journal records which one ran: `python -m ritc practice logs` compares them on the REAL server.
#
# ONE FEATURE AT A TIME (2026-10-15): the frozen bot vs ONE change. Adopt or drop it before adding the next profile.

[A_default]                           # the FROZEN bot (b19e95c logic, config of b04253e): no overrides

[B_drift_cap20]                       # T CAP: charge the adverse drift over at most 20 ticks of the unwind instead of the
"strategy.drift_horizon_ticks" = 20   # whole unwind time (up to 113-163 ticks when flow is thin). Braver on fixed tenders,
                                      # auction bids slightly closer. 17 real evening journals (replay + recorded path):
                                      # 3 answers flip, +$1.0k/heat (t 0.6); daytime 10-14 estimate +$66k / 10 heats.

