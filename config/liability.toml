# LIABILITY TRADING (tender offers)
# Defaults match `python -m ritc sim liability`. On the day, copy tickers, fees,
# order sizes and limits from the case brief.

[case]
# 2027 selection brief (Liquidity Risk Case): 420 s, CRZY $10 / TAME $25 / CROC $20.
tickers = ["CRZY", "TAME", "CROC"]           # the bot also trades every other stock /securities lists
                                             # (RITC 2026 sub-heats each use different tickers)
fee = { CRZY = 0.02, TAME = 0.02, CROC = 0.02 }               # taker commission per share
max_order = { CRZY = 25000, TAME = 10000, CROC = 20000 }      # max shares per order (brief)

[risk]
buffer = 0.98
[risk.groups.equity]                         # name must match /limits
gross = 250000
net = 100000                                 # 2027 brief (was 150,000 in 2026)
weights = { CRZY = 1.0, TAME = 1.0, CROC = 1.0 }

[strategy]
min_profit_per_share = 0.01   # accept only if expected profit/share after costs >= this (0.01: mean $34.1k vs $31.6k at 0.03,
                              # same worst seed; scaled up automatically by the drawdown throttle)
refill_factor = 2.0           # visible depth is ~this fraction of what you can unwind into
competitive_margin = 0.05     # $/share kept when bidding on non-fixed tenders
drift_halflife = 15           # ticks, for the adverse-drift estimate
drift_horizon_ticks = 20      # DEFAULT since 2026-10-14: charge the drift over at most 20 ticks of the unwind (a trend
                              # fades: 47 real tenders, drift x 20 ticks = the next 20 ticks' move, x the full unwind
                              # overcharged 0.23 vs 0.08). Seeds 1-16, 21 markets +$2.5k (t 4.3); holdout 101-116 +$2.0k
                              # (t 4.8); no market worse than -$1.0k (t -0.3). Rejected tenders at 24-37c of edge.
auction_bid = true            # false = never bid auctions (they hold ~55k of room 30 ticks; 0 of 32 won 2026-10-14):
                              # +$1.8k (t 1.8) / holdout +$1.9k (t 1.6) on top of the drift cap, but -$4k..-$5k with
                              # rival desks. Not adopted.
unwind_ticks_per_share = 0.0005  # expected unwind time per share (drift exposure)
min_ticks_to_unwind = 5       # 2027 brief: no end-of-case fine (closed at last price). 15 -> 5: +$1.1-1.8k (t 2.2-3.0), holdout +$0.4-0.6k (t 1.9-2.2), hostile +$0.5-2.0k (t 1.5-1.8)
risk_aversion = 0.3           # $ demanded per unit of GARCH vol x sqrt(unwind ticks)
max_slippage = 0.04           # unwind slices keep VWAP within this of the touch
participation = 0.35          # fraction of visible depth taken per loop
urgent_ticks = 40             # start unwinding harder this many ticks before the end
decide_late_ticks = 0         # USER CHOICE 2026-10-11 (practice): answer every tender AT ONCE, never wait for the timeout.
                              # The simulator preferred 3 (below); restore with --set strategy.decide_late_ticks=3.
                              # 2026-10-12 re-test on the current config, fresh 501-532: 3 = -$0.8k..-$7.0k in calibrated,
                              # Kyle, hostile and generous-reserve markets (RESEARCH.md). The old gains below are stale.
                              # ANSWER LATE: a tender's price is fixed when it arrives but the market moves for its whole
                              # 15-30 s window, so answer 3 ticks before `expires` with the book of THEN (an option on
                              # the tender; a crowd unwinding the same block shows in the price before we commit).
                              # Fresh seeds 301-316: normal +$25.3k (t 4.5, 15/16); anchored hostile +$10.4k (t 4.2);
                              # real-world gaps + hostile +$9.7k (t 3.8); losing heats over 21 stress scenarios 13 -> 1,
                              # worst -$104.9k -> -$2.5k. Seeds 1-16: +$17.0k (t 3.1); holdout 101-116 +$22.0k (t 3.5).
                              # Unanchored hostile -$4.6k (t -0.9): it forgoes the sim's fake displacement edge.
                              # 2 and 4 similar (4: 4 losing heats on 301-316). 0 = answer at once (old behaviour).
decide_late_end_guard = true  # ...but never wait past the last tick a tender can still be accepted (min_ticks_to_unwind /
                              # wind-down): a real-time test missed 3 of 32 tenders whose windows ran past the bell.
                              # Seeds 1-16 +$3.7k (t 4.1), 301-316 +$2.3k (t 2.6); anchored hostile +-$0.1k.
reserve_auction_room = true   # count pending auction bids against the net limit. false: -$1.8k..+$0.3k even when the
                              # server voids awards that no longer fit (sim award_room=1); hostile worst heat worse.
auction_skip_adding = 5000     # AUCTION FREEZE (default since 2026-10-13): decline an auction that would ADD to a block we
                              # still hold >= this many shares of. An open bid freezes the stock ~30 s (front-running
                              # rule) and a win only grows the block. Real heats: CROC 2026-10-13 (~-$15k: frozen
                              # buy-back while CROC rallied) and CRZY 2026-10-12. Fresh seeds 1001-1032: calibrated
                              # +$0.2k, Kyle +$1.2k (worst -$7.7k -> $0), hostile +$1.1k (worst -$64k -> -$32k),
                              # generous reserves -$1.1k; |t| <= 1.1 (fires in 2-4 of 32 heats). 0 = old behaviour.
room_wait = true              # a fixed tender declined ONLY for risk room is re-checked every tick until 2 ticks before
                              # expiry instead of declined at once (answer-at-once still holds for everything else). Real
                              # heats: log2 #103 and the last heat's #403 were declined for room held by an auction bid we
                              # then lost. Calibrated sim (real=1): 301-332 +$3.1k (t 1.6), 801-864 +$5.9k (t 3.3),
                              # 401-464 +$4.1k (t 2.5); pooled 160 seeds never worse in a single heat; hostile +$0.5k (t 1.0).
decide_late_max_window = 30   # safety: answer AT ONCE if `expires` is missing / further than this / unreadable, and never
                              # wait longer than this. Raise it if practice shows windows longer than 30 s.
respect_windows = true        # 2027 brief: "Any trades executed during this window, before the tender decision is
                              # finalized, are flagged as front-running". Don't trade a stock while one of its tenders is
                              # undecided - including our own auction / winner-take-all bids until they expire. Strict
                              # reading: +$3.8k (t 3.6), holdout +$8.3k (t 4.0); lenient reading -$0.4k / +$0.5k (t -0.7/0.7).
booking_ticks = 3             # an accepted tender reaches the position ~1 s later; don't unwind what it will offset (3: with min_ticks 5, t 3.0 / holdout 2.2)
freeze_rejected_bids = true   # SAFETY: an auction / winner-take-all bid stays in the window until it expires even if the
                              # server answers success=false at once, so don't trade that stock before expiry (the bot
                              # did). Strict front-running sim: +$9.6k (t 3.0), hostile+strict +$2.9k (t 2.1); lenient
                              # sim +$2.3k (t 2.3) but holdout -$0.1k (t -0.3). Kept as a fine-safety fix, not for P&L.
hold_valuation = true         # inside close_hold_ticks, value a tender's exit at the mid (the case's free close-out)
                              # with the risk of holding to the bell, when that beats walking the book + fees. Part of
                              # the hold (see close_hold_ticks). Alone on top of the hold: +$3.5k (t 1.9), holdout
                              # +$7.2k (t 3.8). Valuing every tender this way (window 420): +$7.4k but hostile -$2.4k.
decline_explicitly = true     # official rule: trading a ticker while one of its tenders is still PENDING is
                              # "front-running" (2026: fined $1/share, $2 past 5,000 shares, in real time).
                              # Declining at once closes the window, so unwinds of earlier tenders stay clean.
# FORWARD LIQUIDITY (docs/PRACTICE_LOGS.md). "flow": price a tender from the liquidity the market will give us
# while we unwind: exit = the touch our resting orders sit at, unwind time = shares / forecast flow (shares/tick
# traded on our side, EWMA of time & sales), risk premium and drift scale with that time. "book" = walk the
# visible book x refill_factor (the old static model, ~$0.19/share too pessimistic in the practice heats).
# "auctions": the flow model for competitive / winner-take-all bids only, the book walk for fixed tenders.
#   ...and only when |net after the win| <= auction_max_net (shares; unset = always). Tested 2026-10-12: always
#   = wins 1% -> 14% but -$4.1k..-7.3k/heat (the 55k block crowds fixed tenders out of the net limit); 45000 =
#   no loss but no gain (96 fresh seeds -$0.8k, t -1.4). Not adopted.
liquidity_model = "adaptive"  # ADAPTIVE (default since 2026-10-12): start each heat on "book"; once `adaptive_min_obs` untaken
                              # tenders are scored and the learned crowd impact is under 1 sd, price with "flow"; back to
                              # "book" as soon as a crowd shows. Design 501-532: default sim +$3.9k (t 3.1), calibrated
                              # -$0.2k, Kyle +$0.1k, hostile identical. Holdout 601-632: default +$4.0k (t 2.5, worst
                              # -$18.5k -> -$9.2k), calibrated +$3.2k (t 2.2, worst $14.6k -> $23.1k), hostile -$0.3k
                              # (t -1.0) / calibrated hostile identical. "book" = the old default (RESEARCH.md).
adaptive_min_obs = 2          # 4: default sim +$2.6k (t 2.6), calibrated +$0.4k. 0 (flow from the start): real heats
                              # +$5.6k/heat but every rival market -$2..-8.5k, holdout +$0.2k (t 0.4): rejected 2026-10-14
early_probe_ticks = 5         # EARLY PROBE (DEFAULT since 2026-10-14): a fixed tender the book walk declines but the flow
                              # value takes, before the crowd learner has evidence: wait 5 ticks, take it unless the mid ran
                              # > early_probe_max_move (0.05) against the unwind (rival desks show by tick 5: sim -0.21).
                              # 10 real heats: 7 declined winners, est. +$8.5k/heat, no new losers. Sim seeds 1-16 +$3.1k
                              # (t 6.2), holdout 101-116 +$1.0k (t 5.0), rival markets ~0, no worst heat worse (35 markets).
                              # Rejected with it: early_flow_weight (rivals -$4..-7k), value_model = "calibrated" (hostile
                              # markets -$3..-9.7k, worst -7.5k -> -46.6k).
liq_prior = { CRZY = 2600, TAME = 3200, CROC = 1500 }   # shares/tick our resting unwinds got in practice (14 blocks)
# PROFESSOR'S IDEAS (2026-10-12, RESEARCH.md): all tested on fresh seeds 901-932, none adopted.
#   liquidity_model = "ensemble": weighted book / flow / crowd(1.4x size) worlds with a worst-case floor
#     (ensemble_crowd_prior, ensemble_crowd_min, ensemble_crowd_extra, ensemble_flow_weight, ensemble_floor):
#     hostile -$7.7k (t -2.2), worst heat doubles. Logs a SCEN line per tender when on.
trend_learn = true            # DEFAULT since 2026-10-13 (user's choice). TREND = the root cause (10-tick momentum r 0.46,
                              # t 8.5, 3 recorded heats; RESEARCH.md). Learn r live
trend_prior_r = 0.46          # from this heat's prices (non-overlapping 10-tick pairs, all stocks), shrunk to the prior
trend_prior_n = 20            # with weight trend_prior_n pairs.
trend_window = 10
trend_exec = true             # SPRINT: cross (urgent_participation x depth per loop) while r x the run against the block over
trend_cross_cost = 0.05       # the last trend_window ticks >= this $; rest again under half of it. Profile G_trend.
run_ex_own = false            # OWN-IMPACT-FREE RUN (2026-10-14): the trend run minus own_impact x the shares WE crossed in the
own_impact = { CRZY = 4e-6, TAME = 5e-6, CROC = 1.3e-5 }   # window ($/share, measured on our real ~50k sprints). Practice
                              # 2026-10-14: a run continued while we held and rested (r +0.43, t 4.0) but reversed
                              # during our own sprints (r -0.33): the sprint fed on its own impact (CROC -$24.8k, -$23.0k).
book_signal = true            # THIN-SIDE SIGNAL (default since 2026-10-13, passes the testing rule). Predict the next 10 ticks as
book_gate_t = 2.0             # a x last 10-tick run + b x depth asymmetry (cost to cross book_signal_shares on the ask minus
book_signal_shares = 25000    # the bid side: the price moves toward the thin side). a, b learned live from the heat's own
book_prior_a = 0.40           # windows, shrunk to the real fit (3 recorded heats: 0.40 / 0.67, R2 0.37 vs 0.24 momentum
book_prior_b = 0.67           # alone); used only once this heat's own t of b >= book_gate_t (real heats: from tick 50-110),
book_models = "ofi"           # DEFAULT "ofi" since 2026-10-13 (user's choice): try OFI + depth asymmetry first (real backtest
                              # best; the sim can only show no harm, -$74/heat t -1.2); "asym" = run + asymmetry only.
book_prior_n = 20             # momentum alone before. Design 1-24 pooled +$1.3k (t 2.9), holdout 101-124 +$0.6k (t 2.1);
                              # thin-side markets +$1.1k..+$8.3k, random walk / plain trend / hostile ~$0. Ungated: random
                              # walk -$5.2k (t -4.0).
trend_value = false           # charge / credit tenders r x the run against their unwind: no gain on top of trend_exec.
trend_value_cap = 0.15
netting_credit = false        # NETTING (2026-10-13, off): credit the part of a tender that OFFSETS our open block with the
netting_gate = "crowded"      # learned $/share our unwinds cost (prior netting_prior, learn netting_learn, cap netting_cap);
netting_prior = 0.15          # gate "crowded" = off once a crowd shows, true = on only after no-crowd evidence. Solo sim
                              # +$3.4k/heat (t 1.1), rivals -$0.1k..-2.5k; ungated rivals -$5-7k (t -2.1). Profile D.
auction_skip_side = "adding"  # "any": also skip auctions on the OPPOSITE side of a block we unwind (pooled -$0.4k, t -0.9)
reduce_in_windows = false     # keep unwinding a held stock through an open window (brief: reducing trades are allowed).
                              # Strict-fine sim -$18.1k/heat (t -6.2): only if RIT's Transaction Log shows no fine.
rank_tenders = false          # answer the most valuable open tender first: no effect in the sim
drift_symmetric = false       # credit favourable drift too: -$4k..-$13.5k everywhere
crowd_robust = false          # vol-scaled crowd evidence: fixes 2 real false alarms, but holdout hostile worst heats
                              # -$2.7k -> -$25.8k / -$12.2k -> -$46.2k
                              # 27-scenario stress 2026-10-13: "full" -$29.9k and "clip" (+crowd_min_obs 2) -$22.5k in
                              # "everything at once" (real crowd + high vol). Keep false for competition; true (profile
                              # B) only on a practice server with no other teams.
liq_default = 2000            # other tickers
liq_halflife = 20             # ticks
liq_cap = 6000                # never forecast more than this (a burst of other desks' trades is not our flow)
# CROWDED TENDERS (docs/ARCHITECTURE.md): every desk gets the same block and unwinds it into the same book.
# Learn from every tender we did NOT take how far the mid runs against its unwind over `crowd_ticks`, per 10k
# shares; once that is significant (> 2 sd) charge it (crowd_weight x $/10k x size/10k per share) and race it.
# Corrected sim, 16 seeds: hostile +$11.4k (t 3.9), benign -$0.3k (t -1.0); holdout 101-116: hostile +$14.2k
# (t 3.0), benign +$0 (the gate never fires without a crowd). Ungated / learning from our own tenders cost
# $2.8k-$4.9k in the benign market (our own unwind impact looked like a crowd).
crowd_learn = true
crowd_learn_lost_auctions = true   # RIVAL WINNERS (default since 2026-10-13): an auction we lost is a block another desk
                              # now holds and must unwind, starting at the award: score the price from then. 27-scenario
                              # stress, seeds 1301-1316: pooled +$503/heat (t 2.45), better in 22 of 27 (practice thin +
                              # vol +$2.6k, everything at once +$2.4k, rival desks +$2.0k); vol x2 worst heat -$5.0k.
crowd_untaken_only = true     # skip tenders we hold: walking the book already prices our own impact
crowd_gate = true             # charge nothing until the crowd is statistically there
crowd_prior_mean = 0.0        # $/10k shares before anything is learned
crowd_prior_sd = 0.10
crowd_noise_sd = 0.10         # price noise over the scoring window
crowd_ticks = 10              # score each tender's crowd reaction this many ticks after it appears
crowd_weight = 1.0
# Not added (fresh seeds 201-232, POSTMORTEM.md, risk review): crowd race on adverse arrival, per-ticker
# crowd impact, crowd position cap. Each worsened the worst seed with tenders priced off the visible price (anchor=1).
# If the practice rounds show a crowd, set crowd_prior_mean to the learned $/10k (prior sd ~ half of it) instead.

[execution]
unwind_mode = "block"         # "block" (passive-then-aggressive schedule) or "slice" (always cross)
close_hold_ticks = 90         # HOLD TO THE BELL (2027 brief: open positions close at the last traded price, no fine).
                              # In the last 90 s never cross, only rest at the touch; the rest closes at ~mid.
                              # With hold_valuation, 16 seeds: +$7.0k (t 3.8, 16/16), worst $9.9k -> $13.8k; holdout
                              # +$9.5k (t 4.6); hostile -$0.2k (t -0.2) / holdout +$1.3k, worst -$6.5k -> +$2.2k;
                              # all stresses +$2k-$14k. 60: +$5.7k (t 2.8); 120: +$9.4k but gap=6 worst $31k -> $17k.
hold_risk_budget = 40000      # ...and before that, only REST (never cross) while |position| x GARCH sigma x sqrt(ticks
                              # left), the 1-sd $ risk of holding to the bell, is within this budget; cross only the
                              # excess. Random walk + free close-out: holding costs 0 on average, crossing always costs.
                              # 16 seeds: +$4.3k (t 2.9, p adj 0.044), worst $13.8k -> $24.0k, CVaR $21.3k -> $24.5k;
                              # holdout +$5.0k (t 2.2); hostile +$1.7k (t 0.9, worst -$17.6k -> -$4.5k) but hostile
                              # holdout -$1.9k (t -0.6, worst $2.2k -> -$7.4k); scarce passive fills (flow 0.3) +$5.0k,
                              # tenders x2 +$3.7k (t 3.8), twice as often +$9.6k (t 3.4); vol x2 +$0.5k (t 1.1).
                              # 20k: +$3.8k (t 2.9) / holdout t 2.0. Never crossing (close_hold_ticks 420): +$11.7k but
                              # ignores vol; a budget in $ crosses more automatically when GARCH sigma is high.
                              # 2nd holdout (201-216) vs off: +$2.4k (t 2.8); hostile +$6.1k (t 2.1, worst -$9.6k -> +$2.7k).
                              # CAVEAT "everything at once" stress (hostile + vol 1.5 + thin + strict): mean same, worst
                              # -$84k -> -$105k (sd ~$95k, not significant). If the practice case looks manipulated or
                              # far more volatile, lower this (20000) or set 0 for the old cross-to-schedule unwind.
fresh_unwind = true           # SLOW-LOOP SAFETY: resting orders fill while a loop runs, so orders sized from the loop's
                              # start positions took positions through zero (speculation fine). Cancel stale quotes, re-read
                              # open orders THEN positions, cap IOC + resting at what is left (never past zero). Real time,
                              # 1 s loops: seeds 1-10 +$7.6k (t 2.7); 201-210 fines $1,414 -> $48/heat (t -3.7), score +$2.5k
                              # (t 3.1), worst $8.7k -> $12.4k; 101-110 +$1.9k (t 1.1). Lock-step / fast loops: +-$0.1k.
stuck_window_ticks = 0        # ABSORPTION STOP (0 = off): drop a block from the hold_risk_budget passive set when its own
stuck_horizon_ticks = 30      # fills over the last `window` ticks need more than `horizon` ticks to finish it. Fresh 501-532:
                              # -$1.3k..-$2.4k calibrated, -$0.6k..-$1.1k Kyle flow, -$1.9k..-$2.5k hostile (RESEARCH.md).
trend_unwind_z = 0            # TREND: cross instead of resting when the drift runs this many sd against the block.
                              # 2: trending (Kyle) market +$1.1k (t 1.7), calibrated -$0.4k, hostile -$2.3k. Turn on only
                              # if `ritc calibrate` shows a variance ratio clearly above 1 on real recordings.
initial_sprint_ticks = 3      # RACE THE CROWD (default since 2026-10-13, passes the testing rule): once the crowd learner has
initial_sprint_gate = "crowded"   # detected other desks dumping the same blocks (crowded(): impact > 2 sd), cross the first
                              # 3 ticks of every new block (Obizhaeva-Wang-style initial trade), then the usual unwind.
                              # Ungated it lost $13-23k/heat in solo markets. Gated, design 1-24 pooled +$3.6k (t 5.7),
                              # holdout 101-124 +$2.2k (t 4.8): rival markets +$1.2k..+$16.9k, solo markets exactly $0.
sprint_max_walk = 0           # SPRINT WALK CAP ($ from the mid at the block's first sprint; 0 = off). 2026-10-14 after the two
                              # CROC sprints that walked $1.25-1.45: costs in every simulated trending market (seeds 1-24,
                              # pooled 0.05 -$7.7k t -7.5, 0.15 -$3.7k t -5.3, 0.25 -$2.3k t -3.4, 0.50 -$0.9k t -2.0);
                              # helps only without a trend. Rejected; option kept.
live_cross_cost = false       # cross only when the predicted move beats the cost of crossing live_cross_shares in the book now
live_cross_shares = 10000     # + fee (instead of trend_cross_cost): pooled -$0.4k (t -1.2), rejected 2026-10-13.
stall_and_trend = false       # cross only when a block is BOTH stuck (stuck_window_ticks) and trending against us
                              # (trend_unwind_z). 2026-10-13: neutral (+$0, t 0.0); solo worst heat -$76k -> -$62k.
hold_budget_min_ticks = 0     # FLAT BY THE BELL: no passive hold this close to the end (use with close_hold_ticks=0,
                              # hold_valuation=false). 30: -$6.1k with no bell fine, +$7.4k (t 2.5) at $1/share; breaks
                              # even at ~$0.45/share. Switch on only if practice shows a bell fine.
order_settle = 1.0            # s an order we sent counts as working although the server shows it in neither the OPEN
                              # list nor the position (real RIT books orders asynchronously; 2026-10-11 practice sent
                              # duplicate unwind orders 40-250 ms apart -> TAME +10,800 past zero). Lock-step tests use 0.
unwind_horizon_ticks = 30     # target: flat within this many ticks of accepting a tender
horizon_mode = "absorption"   # ADAPTIVE HORIZON (default since 2026-10-13): target = block / the absorption this stock has
horizon_min_ticks = 30        # shown (learned from our own finished blocks), never shorter than 30 s, at most 90 s: a thin
horizon_max_ticks = 90        # book gets the time it needs instead of being swept. 27-scenario stress, seeds 1401-1416: no
                              # scenario worse, pooled +$41/heat (t 1.8). A 15 s floor (shorter horizons) + liquidity-
                              # aware valuation failed (practice worst heats -$11k..-$28k).
crowd_horizon_ticks = 12      # ...but race the crowd once it is detected (learned impact > 2 sd). A FIXED 12 cost
                              #   -$7.6k (t -6.1) in the benign sim; switching only on evidence costs nothing there.
max_slippage = 0.04           # aggressive catch-up slices: VWAP within this of the touch
participation = 0.35          # max fraction of visible depth per aggressive slice
display_qty = 5000            # iceberg: largest passive child shown in the book
urgent_participation = 0.35   # THIN-BOOK URGENCY (default since 2026-10-13): past the schedule's deadline take at most
                              # this x the depth within the price limit per loop, instead of up to max_order (25k), which
                              # swept every re-quote of the house market maker (practice: CRZY $10.12 -> $11.12 while
                              # buying back 55k). 27-scenario stress, seeds 1201-1216: no scenario significantly worse,
                              # pooled +$32/heat (t 0.4), hostile worst heat +$8.3k. 0 = old sweep.
urgent_ticks = 6              # cross for everything left in the final ticks of the schedule
front_load = 0.3              # 0 = linear schedule; >0 = unwind more early (less drift risk)
schedule = "almgren_chriss"   # optimal path from GARCH vol, book-implied impact, risk aversion ("front_load" = old curve)
ac_risk_aversion = 3e-7       # Almgren-Chriss lambda (1/$): higher = unwind faster. 8 seeds: 3e-7 $37.6k/worst $22.5k,
                              # 1e-6 $37.3k, 1e-5 $35.5k, 1e-4 $31.4k; old front_load=0.3 $34.1k/worst $16.9k.
                              # Impact dominates risk here, so near-linear wins; in a more volatile market
                              # (higher GARCH sigma) the same lambda front-loads automatically.
ride_ticks = 1                # RIDE (DEFAULT since 2026-10-14): while the predicted next move is our way by >= ride_min (0.02;
                              # momentum / book model, as for the sprint), rest 1 tick behind the touch and never cross.
                              # Real: after a rested block's last fill the mid moved our way +0.13 / +0.24 in 10 / 20 ticks
                              # (t 6.2). Sim seeds 1-16 +$0.6k (t 3.2), holdout +$1.1k (t 7.3); passive-impact markets
                              # +$3.8..6.6k, rivals ~0. 2 ticks +$0.3k (t 1.3); always riding -$10k without the rebound.
ride_min = 0.02
ride_end_ticks = 60           # never ride this close to the bell

[run]
max_drawdown = 0              # kill switch OFF (0 = off; was 15000). Halting after one bad block forfeits every later
                              # tender, and the brief's prices are a random walk (no momentum to stop). 2027 sim, 16 seeds:
                              # hostile +$16.9k (t 2.7), holdout +$18.2k (t 3.1, worst -$14.7k -> +$6.3k); all stresses
                              # at once +$69.7k (t 5.1); normal market exactly unchanged.
drawdown_soft_start = 0.5     # from this fraction of max_drawdown, new-risk sizes shrink linearly...
drawdown_floor = 0.25         # ...to this fraction at the kill (exits/hedges always run at full size)
feed_poll = 0.1               # real-time news/tender poll interval, seconds
interval = 0.25
wind_down_ticks = 5

