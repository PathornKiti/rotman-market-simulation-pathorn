# LIABILITY TRADING (tender offers)
# Defaults match `python -m ritc sim liability`. On the day, copy tickers, fees,
# order sizes and limits from the case brief.

[case]
tickers = ["CRZY", "TAME"]
fee = { CRZY = 0.02, TAME = 0.02 }          # taker commission per share
max_order = { CRZY = 10000, TAME = 10000 }  # max shares per order

[risk]
buffer = 0.98
[risk.groups.equity]                         # name must match /limits
gross = 250000
net = 150000
weights = { CRZY = 1.0, TAME = 1.0 }

[strategy]
min_profit_per_share = 0.03   # accept only if expected profit/share after costs >= this
refill_factor = 2.0           # visible depth is ~this fraction of what you can unwind into
competitive_margin = 0.05     # $/share kept when bidding on non-fixed tenders
drift_halflife = 15           # ticks, for the adverse-drift estimate
unwind_ticks_per_share = 0.0005  # expected unwind time per share (drift exposure)
min_ticks_to_unwind = 15      # decline tenders this close to the bell
risk_aversion = 0.3           # $ demanded per unit of GARCH vol x sqrt(unwind ticks)
max_slippage = 0.04           # unwind slices keep VWAP within this of the touch
participation = 0.35          # fraction of visible depth taken per loop
urgent_ticks = 40             # start unwinding harder this many ticks before the end
decline_explicitly = false
price_queue = false           # opt-in; lowered variance but cost mean NLV on 5/6 sim seeds.
                              # price a tender's unwind BEHIND inventory we are still unwinding on that ticker

[execution]
unwind_mode = "block"         # "block" (passive-then-aggressive schedule) or "slice" (always cross)
unwind_horizon_ticks = 30     # target: flat within this many ticks of accepting a tender
max_slippage = 0.04           # aggressive catch-up slices: VWAP within this of the touch
participation = 0.35          # max fraction of visible depth per aggressive slice
display_qty = 5000            # iceberg: largest passive child shown in the book
urgent_ticks = 6              # cross for everything left in the final ticks of the schedule
front_load = 0.3              # 0 = linear schedule; >0 = unwind more early (less drift risk)

[run]
max_drawdown = 0             # kill switch: $ below peak NLV that halts + flattens (0 = off; set from the case's typical P&L)
feed_poll = 0.1               # real-time news/tender poll interval, seconds
interval = 0.25
wind_down_ticks = 5
