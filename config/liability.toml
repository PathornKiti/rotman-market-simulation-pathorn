# LIABILITY TRADING (tender offers)
# Defaults match `python -m ritc sim liability`. On the day, copy tickers, fees,
# order sizes and limits from the case brief.

[case]
tickers = ["CRZY", "TAME"]
fee = { CRZY = 0.02, TAME = 0.02 }          # taker commission per share
max_order = { CRZY = 10000, TAME = 10000 }  # max shares per order

[risk]
buffer = 0.98
[risk.groups.equity]                         # name must match /limits
gross = 250000
net = 150000
weights = { CRZY = 1.0, TAME = 1.0 }

[strategy]
min_profit_per_share = 0.01   # accept only if expected profit/share after costs >= this (0.01: mean $34.1k vs $31.6k at 0.03,
                              # same worst seed; scaled up automatically by the drawdown throttle)
refill_factor = 2.0           # visible depth is ~this fraction of what you can unwind into
competitive_margin = 0.05     # $/share kept when bidding on non-fixed tenders
drift_halflife = 15           # ticks, for the adverse-drift estimate
unwind_ticks_per_share = 0.0005  # expected unwind time per share (drift exposure)
min_ticks_to_unwind = 15      # decline tenders this close to the bell
risk_aversion = 0.3           # $ demanded per unit of GARCH vol x sqrt(unwind ticks)
max_slippage = 0.04           # unwind slices keep VWAP within this of the touch
participation = 0.35          # fraction of visible depth taken per loop
urgent_ticks = 40             # start unwinding harder this many ticks before the end
decline_explicitly = true     # official rule: trading a ticker while one of its tenders is still PENDING is
                              # "front-running"; its profit is dropped from the Adjusted P&L but losses count.
                              # Declining at once closes the window, so unwinds of earlier tenders stay clean.
# CROWDED TENDERS (docs/HOSTILE_MARKET.md): every desk gets the same block and unwinds it into the same book.
# Learn from every tender we did NOT take how far the mid runs against its unwind over `crowd_ticks`, per 10k
# shares; once that is significant (> 2 sd) charge it (crowd_weight x $/10k x size/10k per share) and race it.
# Corrected sim, 16 seeds: hostile +$11.4k (t 3.9), benign -$0.3k (t -1.0); holdout 101-116: hostile +$14.2k
# (t 3.0), benign +$0 (the gate never fires without a crowd). Ungated / learning from our own tenders cost
# $2.8k-$4.9k in the benign market (our own unwind impact looked like a crowd).
crowd_learn = true
crowd_untaken_only = true     # skip tenders we hold: walking the book already prices our own impact
crowd_gate = true             # charge nothing until the crowd is statistically there
crowd_prior_mean = 0.0        # $/10k shares before anything is learned
crowd_prior_sd = 0.10
crowd_noise_sd = 0.10         # price noise over the scoring window
crowd_ticks = 10              # score each tender's crowd reaction this many ticks after it appears
crowd_weight = 1.0

[execution]
unwind_mode = "block"         # "block" (passive-then-aggressive schedule) or "slice" (always cross)
unwind_horizon_ticks = 30     # target: flat within this many ticks of accepting a tender
crowd_horizon_ticks = 12      # ...but race the crowd once it is detected (learned impact > 2 sd). A FIXED 12 cost
                              #   -$7.6k (t -6.1) in the benign sim; switching only on evidence costs nothing there.
max_slippage = 0.04           # aggressive catch-up slices: VWAP within this of the touch
participation = 0.35          # max fraction of visible depth per aggressive slice
display_qty = 5000            # iceberg: largest passive child shown in the book
urgent_ticks = 6              # cross for everything left in the final ticks of the schedule
front_load = 0.3              # 0 = linear schedule; >0 = unwind more early (less drift risk)
schedule = "almgren_chriss"   # optimal path from GARCH vol, book-implied impact, risk aversion ("front_load" = old curve)
ac_risk_aversion = 3e-7       # Almgren-Chriss lambda (1/$): higher = unwind faster. 8 seeds: 3e-7 $37.6k/worst $22.5k,
                              # 1e-6 $37.3k, 1e-5 $35.5k, 1e-4 $31.4k; old front_load=0.3 $34.1k/worst $16.9k.
                              # Impact dominates risk here, so near-linear wins; in a more volatile market
                              # (higher GARCH sigma) the same lambda front-loads automatically.

[run]
max_drawdown = 15000          # kill switch: $ below peak NLV -> flatten + halt. A CATASTROPHE stop, ~1.5-2x the
                             # worst normal drawdown on 8 sim seeds: $9.4k.
                             # Set near the normal drawdown it cuts winners at the bottom. Rescale to the real case's P&L.
drawdown_soft_start = 0.5     # from this fraction of max_drawdown, new-risk sizes shrink linearly...
drawdown_floor = 0.25         # ...to this fraction at the kill (exits/hedges always run at full size)
feed_poll = 0.1               # real-time news/tender poll interval, seconds
interval = 0.25
wind_down_ticks = 5
