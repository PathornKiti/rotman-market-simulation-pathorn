[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ritc-bots"
version = "0.1.0"
description = "Trading bots for the Rotman International Trading Competition (RIT REST API)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
report = ["openpyxl>=3.1"]    # .xlsx for `ritc report` (the .html needs nothing)

[project.scripts]
ritc = "ritc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905", "B027"]   # B027: optional no-op hooks on Strategy are intentional

[tool.ruff.lint.per-file-ignores]
"src/ritc/postmortem/html.py" = ["E501"]   # HTML / CSS / SVG template strings
"src/ritc/postmortem/stress_report.py" = ["E501"]
"src/ritc/postmortem/bundle.py" = ["E501"]
"tests/test_postmortem.py" = ["E501"]      # verbatim bot log lines as fixtures
